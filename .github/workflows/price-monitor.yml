name: Monitor de Preços

on:
  schedule:
    - cron: "0 */6 * * *" # a cada 6 horas
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      - name: Rodar monitoramento
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python price_monitor.py

      - name: Salvar histórico e token atualizados
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "actions@github.com"
          git add price_history.json ml_token.json
          git diff --staged --quiet || git commit -m "Atualiza histórico de preços e token do ML"
          git push
