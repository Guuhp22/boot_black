name: ML - Obter Token (uso único)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código de autorização (o que vem depois de code= na URL)"
        required: true
      redirect_uri:
        description: "A mesma Redirect URI usada no app e na autorização"
        required: true

jobs:
  obter-token:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar código por access_token e refresh_token
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          REDIRECT_URI: ${{ inputs.redirect_uri }}
        run: |
          curl -s -X POST "https://api.mercadolibre.com/oauth/token" \
            -H "accept: application/json" \
            -H "content-type: application/x-www-form-urlencoded" \
            -d "grant_type=authorization_code" \
            -d "client_id=$ML_CLIENT_ID" \
            -d "client_secret=$ML_CLIENT_SECRET" \
            -d "code=$CODE" \
            -d "redirect_uri=$REDIRECT_URI"
